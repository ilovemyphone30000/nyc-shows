<title>NYC Shows This Week</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500&family=Tinos:ital@0;1&display=swap">
<style>
/* Layout: masthead + one Times headline, then a sticky filter strip over a two-column venue ledger (venue | its week of bills).
   Palette and type follow the THE·TEAM identity system (Mar '26): Softened Black on Digital White, cool greys as neutrals,
   Forest Green as the sparing signifier. Gotham Medium/Book (Montserrat stand-in), Times roman + italic, never bold. */
:root {
  --bg: #fffdf8;          /* Digital White */
  --panel: #f3f2ee;
  --ink: #100906;         /* Softened Black */
  --grey7: #97999b;       /* Cool Grey 7 */
  --grey4: #bbbcbc;       /* Cool Grey 4 */
  --grey1: #d9d9d6;       /* Cool Grey 1 */
  --muted: #6f7173;       /* Cool Grey 7, deepened for small text */
  --accent: #2e7040;      /* Forest Green */
  --sans: "Gotham", "Montserrat", "Helvetica Neue", Arial, sans-serif;
  --serif: "Times New Roman", "Tinos", Times, serif;
  color-scheme: light;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-weight: 400; font-size: 14px; line-height: 1.45; letter-spacing: -.02em; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 1180px; margin: 0 auto; padding-inline: clamp(16px, 4vw, 40px); }
.label { font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; }

/* masthead */
.mast { border-bottom: 1px solid var(--grey1); }
.mast .wrap { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-block: 18px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
.checked { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.checked .dot { width: 7px; height: 7px; }

/* hero */
.hero .wrap { padding-block: clamp(24px, 4vw, 40px) clamp(20px, 3vw, 32px); }
.hero h1 {
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(30px, 4.2vw, 44px); line-height: 1; letter-spacing: -.02em;
  margin: 16px 0 0; text-wrap: balance;
  display: inline-block; transform: scaleX(.9); transform-origin: left; width: 111%;
}
.hero h1 em { font-style: italic; color: var(--accent); }
.hero p { color: var(--muted); max-width: 58ch; margin: 20px 0 0; }

/* tabs + filters */
.tabs { border-top: 1px solid var(--grey1); }
.tabs .wrap { display: flex; gap: 12px 20px; padding-block: 16px; flex-wrap: wrap; align-items: center; }
.sortby { color: var(--grey7); }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.tab {
  background: var(--bg); border: 0; padding: 10px 22px; cursor: pointer;
  font-weight: 500; font-size: 14px; color: var(--ink);
}
.seg .tab + .tab { border-left: 1px solid var(--ink); }
.seg .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.seg .tab:not([aria-selected="true"]):hover { background: var(--panel); }
.tab.saved { margin-left: auto; padding: 10px 0; background: none; color: var(--muted); border-bottom: 1px solid transparent; }
.tab.saved[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab.saved:hover { color: var(--accent); }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-block: 1px solid var(--grey1); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding-block: 10px; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip {
  font-family: var(--sans); font-size: 10px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase;
  background: var(--bg); border: 1px solid var(--grey1); padding: 7px 10px; cursor: pointer; border-radius: 0;
  font-variant-numeric: tabular-nums;
}
.chip:hover { border-color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { font-size: 10px; opacity: .6; margin-left: 3px; }
.search { flex: 1 1 180px; min-width: 0; max-width: 280px; background: var(--bg); border: 1px solid var(--grey1); border-radius: 0; padding: 7px 10px; font: inherit; font-size: 13px; color: var(--ink); }
.search::placeholder { color: var(--muted); }
.count { margin-left: auto; color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* sections */
main { padding-block: 8px 80px; }
.sect-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding-block: 28px 10px; border-bottom: 1px solid var(--grey1); }
.sect-head h2 { font-family: var(--serif); font-weight: 400; font-size: clamp(22px, 2.6vw, 26px); letter-spacing: -.02em; margin: 0; }
.sect-head h2 em { font-style: italic; }

.venue { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); border-bottom: 1px solid var(--grey1); }
.venue-name { padding: 18px 20px 18px 0; border-right: 1px solid var(--grey4); }
.venue-name h3 { font-family: var(--serif); font-weight: 400; font-size: 27px; color: var(--accent); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 8px; }
.venue-name .label { color: var(--muted); display: block; line-height: 1.7; }
.rows { min-width: 0; }

.row {
  display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 4px 16px;
  padding: 14px 0 14px 18px; align-items: start; border-bottom: 1px dotted var(--grey1);
}
.rows .row:last-child { border-bottom: 0; }
.list .row { padding-left: 0; }
.when { color: var(--ink); padding-top: 4px; }
.when b { display: block; font-weight: 500; }
.when span { color: var(--muted); font-weight: 500; }
.bill { min-width: 0; }
.head { font-weight: 500; font-size: 16px; letter-spacing: -.02em; }
.head a { text-decoration: none; border-bottom: 1px solid var(--grey4); }
.head a:hover { color: var(--accent); border-color: var(--accent); }
.support { margin-top: 4px; display: flex; gap: 2px 10px; flex-wrap: wrap; align-items: baseline; }
.support .label { color: var(--grey7); font-size: 9px; }
.support .acts { color: var(--ink); }
.support .acts i { font-style: normal; color: var(--grey4); margin: 0 6px; }
.support.none .acts { color: var(--grey7); }
.at { margin-top: 5px; color: var(--muted); font-size: 15px; }
.at b { color: var(--accent); font-weight: 500; }
.meta { display: flex; gap: 12px; align-items: center; white-space: nowrap; font-size: 12px; color: var(--muted); padding-top: 2px; }
.meta .t { font-variant-numeric: tabular-nums; }
.save { background: none; border: 0; cursor: pointer; padding: 2px; line-height: 0; color: var(--grey7); }
.save svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.save[aria-pressed="true"] { color: var(--accent); }
.save[aria-pressed="true"] svg { fill: currentColor; }
.save:hover { color: var(--accent); }

.empty { padding: 48px 0; color: var(--muted); max-width: 52ch; }
.foot { color: var(--muted); border-top: 1px solid var(--grey1); padding-block: 24px 40px; font-size: 13px; }
.foot p { max-width: 70ch; margin: 0 0 6px; }
.credit { margin-top: 18px !important; font-size: 9px; letter-spacing: .12em; text-transform: uppercase; color: var(--grey7); }

@media (max-width: 720px) {
  .venue { grid-template-columns: 1fr; }
  .venue-name { border-right: 0; border-bottom: 1px solid var(--grey1); padding: 16px 0 10px; }
  .row { grid-template-columns: 52px minmax(0, 1fr); padding-left: 0; }
  .meta { grid-column: 2; }
  .count { margin-left: 0; width: 100%; }
  .search { max-width: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .chip, .tab, .save, .head a { transition: color .12s, background-color .12s, border-color .12s; }
}
</style>

<header class="mast">
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span class="label">NYC Shows</span></div>
    <div class="checked label"><span class="dot"></span><span id="checked"></span></div>
  </div>
</header>

<section class="hero">
  <div class="wrap">
    <div class="label" id="eyebrow"></div>
    <h1><em id="range"></em></h1>
  </div>
</section>

<nav class="tabs" aria-label="Views">
  <div class="wrap" role="tablist">
    <span class="label sortby">Sort by</span>
    <span class="seg">
      <button class="tab" role="tab" data-view="date">Date</button>
      <button class="tab" role="tab" data-view="venue">Venue</button>
    </span>
    <button class="tab saved" role="tab" data-view="saved">Saved (<span id="savedN">0</span>)</button>
  </div>
</nav>

<div class="bar">
  <div class="wrap">
    <div class="chips" id="dayChips" aria-label="Day"></div>
    <input class="search" id="q" type="search" placeholder="Search artist or venue" aria-label="Search artist or venue">
    <div class="count label" id="count"></div>
  </div>
</div>

<main class="wrap" id="out"></main>

<footer class="foot">
  <div class="wrap">
    <p id="source"></p>
    <p>Hearts are saved in this browser only.</p>
    <p class="credit">Created by Jonah Bierman</p>
  </div>
</footer>

<script>
const DATA = /*DATA*/null/*END*/;

const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const FULLDAY = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

const d8 = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const dow = s => DAYS[d8(s).getDay()];
const md = s => { const d = d8(s); return MONTHS[d.getMonth()] + " " + d.getDate(); };
const fmtTime = t => { let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return h + (m ? ":" + String(m).padStart(2, "0") : "") + " " + ap; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const norm = s => s.normalize("NFKD").replace(/[̀-ͯ]/g, "").toLowerCase();

const store = {
  get(k, d) { try { const v = localStorage.getItem("nycshows_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nycshows_" + k, JSON.stringify(v)); } catch (e) {} },
};

const shows = DATA.shows;
const weekDays = [];
for (let d = d8(DATA.week[0]); d <= d8(DATA.week[1]); d.setDate(d.getDate() + 1)) {
  weekDays.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));
}

let state = { view: store.get("view2", "date"), day: "all", q: "" };
if (!["date", "venue", "saved"].includes(state.view)) state.view = "date";
let saved = new Set(store.get("saved", []));

/* static copy */
document.getElementById("checked").textContent = "Checked " + dow(DATA.checked) + " " + md(DATA.checked);
document.getElementById("eyebrow").textContent = "New York City";
document.getElementById("range").textContent = md(DATA.week[0]) + " – " + md(DATA.week[1]);
document.getElementById("source").textContent =
  "Listings from Oh My Rockness, pulled " + md(DATA.checked) + ". Comedy, spoken word and out-of-state dates are left out. " +
  "Runs with an identical bill on consecutive nights are folded into one row in the venue view.";

/* chips */
function chip(label, key, val, extra) {
  return `<button class="chip" data-${key}="${esc(val)}" aria-pressed="false">${label}${extra ? `<small>${extra}</small>` : ""}</button>`;
}
document.getElementById("dayChips").innerHTML =
  chip("All days", "day", "all") + weekDays.map(d => chip(dow(d), "day", d, d8(d).getDate())).join("");

/* filtering */
function matches(s) {
  if (state.day !== "all" && s.date !== state.day) return false;
  if (state.view === "saved" && !saved.has(s.id)) return false;
  if (state.q) {
    const hay = norm([s.headliner, ...s.support, s.venue].join(" "));
    if (!norm(state.q).split(/\s+/).every(w => hay.includes(w))) return false;
  }
  return true;
}

/* Identical bill at the same venue on back-to-back nights → one row (venue view only). */
function foldRuns(list) {
  const key = s => [s.venue, s.time, s.headliner, ...s.support].join("|").toLowerCase();
  const out = [];
  for (const s of list) {
    const prev = out.find(r => key(r) === key(s) && (d8(s.date) - d8(r.dates[r.dates.length - 1])) === 864e5);
    if (prev) prev.dates.push(s.date), prev.ids.push(s.id);
    else out.push({ ...s, dates: [s.date], ids: [s.id] });
  }
  return out;
}

const HEART = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>';

function row(s, withVenue) {
  const dates = s.dates || [s.date];
  const day = dates.length > 1 ? dow(dates[0]) + "–" + dow(dates[dates.length - 1]) : dow(dates[0]);
  const ids = s.ids || [s.id];
  const on = ids.every(id => saved.has(id));
  const support = s.support.length
    ? `<div class="support"><span class="label">Support</span><span class="acts">${s.support.map(esc).join("<i>·</i>")}</span></div>`
    : `<div class="support none"><span class="label">Support</span><span class="acts">None listed</span></div>`;
  return `<div class="row">
    <div class="when label"><b>${day}</b><span>${dates.length > 1 ? dates.length + " nights" : d8(dates[0]).getDate()}</span></div>
    <div class="bill">
      <div class="head">${s.ticketUrl ? `<a href="${esc(s.ticketUrl)}" target="_blank" rel="noopener">${esc(s.headliner)}</a>` : esc(s.headliner)}</div>
      ${support}
      ${withVenue ? `<div class="at"><b>${esc(s.venue)}</b></div>` : ""}
    </div>
    <div class="meta">
      <span class="t">${fmtTime(s.time)}</span>
      ${s.age ? `<span>${esc(s.age)}</span>` : ""}
      <button class="save" data-ids="${ids.join(",")}" aria-pressed="${on}" aria-label="${on ? "Unsave" : "Save"} ${esc(s.headliner)}">${HEART}</button>
    </div>
  </div>`;
}

function renderVenues(list) {
  let html = "";
  {
    const byVenue = new Map();
    for (const s of list) (byVenue.get(s.venue) || byVenue.set(s.venue, []).get(s.venue)).push(s);
    const venues = [...byVenue.entries()].sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
    html += `<div class="sect-head"><h2>Venues</h2><span class="label">${venues.length} venue${venues.length === 1 ? "" : "s"} · ${list.length} show${list.length === 1 ? "" : "s"}</span></div>`;
    for (const [v, vs] of venues) {
      const tier = vs[0].tier;
      html += `<div class="venue">
        <div class="venue-name"><h3>${esc(v)}</h3><span class="label">${vs.length} show${vs.length === 1 ? "" : "s"}${tier ? " · " + tier : ""}</span></div>
        <div class="rows">${foldRuns(vs).map(s => row(s, false)).join("")}</div>
      </div>`;
    }
  }
  return html;
}

function renderDates(list) {
  let html = "";
  for (const d of weekDays) {
    const inD = list.filter(s => s.date === d).sort((a, b) => a.time.localeCompare(b.time) || a.venue.localeCompare(b.venue));
    if (!inD.length) continue;
    html += `<div class="sect-head"><h2>${FULLDAY[d8(d).getDay()]}, ${md(d)}</h2><span class="label">${inD.length} show${inD.length === 1 ? "" : "s"}</span></div>
      <div class="list">${inD.map(s => row(s, true)).join("")}</div>`;
  }
  return html;
}

function render() {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === state.view));
  document.querySelectorAll("[data-day]").forEach(c => c.setAttribute("aria-pressed", c.dataset.day === state.day));
  document.getElementById("savedN").textContent = saved.size;

  const list = shows.filter(matches);
  const nv = new Set(list.map(s => s.venue)).size;
  document.getElementById("count").textContent = list.length + " shows · " + nv + " venues";

  const out = document.getElementById("out");
  if (!list.length) {
    out.innerHTML = `<p class="empty">${
      state.view === "saved" && !saved.size ? "Nothing saved yet. Tap the heart on any show to keep it here."
      : "No shows match these filters. Try another day or clear the search."}</p>`;
    return;
  }
  out.innerHTML = state.view === "venue" ? renderVenues(list) : renderDates(list);
}

document.querySelector(".tabs").addEventListener("click", e => {
  const t = e.target.closest(".tab"); if (!t) return;
  state.view = t.dataset.view; store.set("view2", state.view); render();
});
document.querySelector(".bar").addEventListener("click", e => {
  const c = e.target.closest(".chip"); if (!c) return;
  if (c.dataset.day) state.day = c.dataset.day;
  render();
});
document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
document.getElementById("out").addEventListener("click", e => {
  const b = e.target.closest(".save"); if (!b) return;
  const ids = b.dataset.ids.split(",");
  const on = !ids.every(id => saved.has(id));
  ids.forEach(id => on ? saved.add(id) : saved.delete(id));
  store.set("saved", [...saved]);
  render();
});

render();
</script>
